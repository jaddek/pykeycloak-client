name: CI

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      - 'dev'
      - 'feature/*'
      - 'hotfix/*'
  workflow_dispatch:
    inputs:
      run_integration_matrix:
        description: "Run Keycloak compatibility matrix"
        required: false
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync package version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release-bump

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Install the project
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Ty
        run: uv run ty check src

      - name: Run MCP smoke test
        run: make mcp-smoke

      - name: Run Pytests with coverage
        run: uv run pytest --cov --cov-report=term-missing -q

      - name: Audit Python dependencies for known CVEs
        run: |
          uv export --frozen --format requirements.txt --all-groups --no-emit-project -o /tmp/requirements-audit.txt
          uv run pip-audit --strict --requirement /tmp/requirements-audit.txt --no-deps

  build:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync package version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release-bump

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync

      - name: Build the project
        run: uv build

      - name: Generate SBOM (CycloneDX JSON)
        run: uvx cyclonedx-py environment --output-format JSON --output-file dist/sbom.cyclonedx.json

      - name: Enforce SBOM license policy
        run: python bin/check_sbom_licenses.py --sbom dist/sbom.cyclonedx.json --policy .license-policy.toml

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*

  integration-keycloak-matrix:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration_matrix
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        keycloak-version: ["24.0", "25.0", "26.0"]
    services:
      keycloak:
        image: quay.io/keycloak/keycloak:${{ matrix.keycloak-version }}
        command: start-dev
        ports:
          - 8080:8080
        env:
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
        options: >-
          --health-cmd="bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for Keycloak
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/realms/master >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak did not become ready in time" >&2
          docker logs "$(docker ps --filter name=keycloak --format '{{.ID}}' | head -n 1)" || true
          exit 1

      - name: Provision integration realm and client
        shell: bash
        run: |
          set -euo pipefail

          admin_token=$(curl --fail --silent \
            --data-urlencode username=admin \
            --data-urlencode password=admin \
            --data-urlencode grant_type=password \
            --data-urlencode client_id=admin-cli \
            http://127.0.0.1:8080/realms/master/protocol/openid-connect/token | jq -r '.access_token')
          test -n "$admin_token" && test "$admin_token" != null

          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8080/admin/realms \
            -H "Authorization: Bearer $admin_token" \
            -H 'Content-Type: application/json' \
            --data '{"realm":"it","enabled":true}'

          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8080/admin/realms/it/clients \
            -H "Authorization: Bearer $admin_token" \
            -H 'Content-Type: application/json' \
            --data '{"clientId":"pykeycloak-it","name":"pykeycloak integration tests","enabled":true,"protocol":"openid-connect","publicClient":false,"secret":"pykeycloak-it-secret","serviceAccountsEnabled":true,"directAccessGrantsEnabled":true}'

          client_uuid=$(curl --fail --silent \
            -H "Authorization: Bearer $admin_token" \
            'http://127.0.0.1:8080/admin/realms/it/clients?clientId=pykeycloak-it' | jq -r '.[0].id')
          management_client_uuid=$(curl --fail --silent \
            -H "Authorization: Bearer $admin_token" \
            'http://127.0.0.1:8080/admin/realms/it/clients?clientId=realm-management' | jq -r '.[0].id')
          service_account_uuid=$(curl --fail --silent \
            -H "Authorization: Bearer $admin_token" \
            "http://127.0.0.1:8080/admin/realms/it/clients/$client_uuid/service-account-user" | jq -r '.id')
          manage_users_role=$(curl --fail --silent \
            -H "Authorization: Bearer $admin_token" \
            "http://127.0.0.1:8080/admin/realms/it/clients/$management_client_uuid/roles/manage-users")

          curl --fail --silent --show-error \
            -X POST "http://127.0.0.1:8080/admin/realms/it/users/$service_account_uuid/role-mappings/clients/$management_client_uuid" \
            -H "Authorization: Bearer $admin_token" \
            -H 'Content-Type: application/json' \
            --data "[$manage_users_role]"

          echo '::add-mask::pykeycloak-it-secret'
          {
            echo 'PYKEYCLOAK_INTEGRATION_ENABLED=1'
            echo 'KEYCLOAK_BASE_URL=http://127.0.0.1:8080'
            echo 'KEYCLOAK_REALM_IT_REALM_NAME=it'
            echo "KEYCLOAK_REALM_IT_CLIENT_UUID=$client_uuid"
            echo 'KEYCLOAK_REALM_IT_CLIENT_ID=pykeycloak-it'
            echo 'KEYCLOAK_REALM_IT_CLIENT_SECRET=pykeycloak-it-secret'
          } >> "$GITHUB_ENV"

      - name: Install the project
        run: uv sync --dev

      - name: Run Keycloak integration tests
        run: uv run pytest tests/integration -m integration -vv -s

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Strip non-package files before PyPI upload
        run: find dist -mindepth 1 -maxdepth 1 ! -name '*.whl' ! -name '*.tar.gz' -delete

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}


      - name: Clean up
        run: |
          rm -rf dist

  release:
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Create GitHub Release with autogenerated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
